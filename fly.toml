# fly.toml app configuration file for Imperium Antiquitas (API only)
# See https://fly.io/docs/reference/configuration/
#
# Secrets to set once:  fly secrets set DATABASE_URL=... JWT_SECRET=...
# The server synchronises the Prisma schema itself at boot (AUTO_DB_PUSH), there is no
# migrations folder yet, so no release_command.

app = 'jeu-final'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # The game tick must keep running: never stop the last machine
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
