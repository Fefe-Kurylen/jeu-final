# fly.toml app configuration file for Imperium Antiquitas (API only)
# See https://fly.io/docs/reference/configuration/
#
# Secrets to set once:  fly secrets set DATABASE_URL=... JWT_SECRET=...   (JWT_SECRET: 32+ chars)
# The server applies the versioned migrations of prisma/migrations itself at boot (DB_SYNC=migrate).
# To run them as a release step instead: set DB_SYNC=none below and uncomment the [deploy] section.
#
# [deploy]
#   release_command = "npx prisma migrate deploy"

app = 'jeu-final'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # The game tick must keep running: never stop the last machine
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
