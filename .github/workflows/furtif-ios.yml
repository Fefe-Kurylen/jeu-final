# Furtif Browser iOS : compilation de vérification à chaque push, TestFlight / App Store à la demande.
name: Furtif iOS

on:
  push:
    branches: [main, claude/furtif-navigateur]
    paths: ["furtif/ios-browser/**", ".github/workflows/furtif-ios.yml"]
  pull_request:
    paths: ["furtif/ios-browser/**"]
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane fastlane à exécuter"
        type: choice
        options: [build, beta, release]
        default: build

concurrency:
  group: furtif-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler (${{ github.event.inputs.lane || 'build' }})
    runs-on: macos-15
    defaults:
      run:
        working-directory: furtif/ios-browser
    steps:
      - uses: actions/checkout@v4

      - name: Version de Xcode
        run: xcodebuild -version

      - name: Installer XcodeGen et fastlane
        run: |
          brew install xcodegen
          gem install bundler
          bundle install

      - name: Générer le projet
        run: xcodegen generate
        env:
          FURTIF_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Compilation de vérification (appareil iOS, sans signature)
        if: ${{ (github.event.inputs.lane || 'build') == 'build' }}
        run: |
          set -o pipefail
          xcodebuild -project FurtifBrowser.xcodeproj -scheme FurtifBrowser \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcodebuild.log | grep -E --line-buffered "error:|warning:|BUILD|Compiling|Linking|CompileAssetCatalog" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: TestFlight / App Store
        if: ${{ github.event.inputs.lane == 'beta' || github.event.inputs.lane == 'release' }}
        run: bundle exec fastlane ios ${{ github.event.inputs.lane }}
        env:
          CI: true
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          MATCH_KEYCHAIN_NAME: fastlane.keychain-db
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: 1

      - name: Conserver les journaux
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            furtif/ios-browser/xcodebuild.log
            ~/Library/Logs/gym/*.log
            ~/Library/Logs/fastlane/**
          if-no-files-found: ignore
