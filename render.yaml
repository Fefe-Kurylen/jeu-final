databases:
  - name: imperium-db
    plan: free            # expires after 90 days: upgrade before going live with real players
    databaseName: imperium
    region: frankfurt

services:
  - type: web
    name: imperium-antiquitas-api
    plan: free            # free instances sleep after 15 min: the game tick stops with them (use starter for a live world)
    runtime: node
    region: frankfurt
    # The schema is synchronised by the server at boot (prisma db push), not at build time
    buildCommand: npm ci --omit=dev && npx prisma generate
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: imperium-db
          property: connectionString
