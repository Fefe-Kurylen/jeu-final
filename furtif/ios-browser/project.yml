# Projet Xcode généré avec XcodeGen : `brew install xcodegen && xcodegen generate` puis ouvrir FurtifBrowser.xcodeproj
name: FurtifBrowser
options:
  bundleIdPrefix: fr.furtif
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  FurtifBrowser:
    type: application
    platform: iOS
    sources:
      - path: FurtifBrowser
    info:
      path: FurtifBrowser/Info.plist
      properties:
        CFBundleDisplayName: Furtif
        CFBundleName: Furtif
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes: [http, https]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [http, https]
            CFBundleURLName: fr.furtif.browser
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
