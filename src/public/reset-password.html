<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imperium Antiquitas — Nouveau mot de passe</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; background: #f6efe0; color: #2a2018; margin: 0; padding: 24px; line-height: 1.55; }
  main { max-width: 480px; margin: 0 auto; background: #fffaf0; border: 1px solid #c9a227; border-radius: 10px; padding: 28px 32px; }
  h1 { color: #8a5a10; margin-top: 0; font-size: 1.4em; }
  label { display: block; margin: 14px 0 6px; font-weight: bold; }
  input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border: 1px solid #c9a227; border-radius: 6px; background: #fff; }
  button { margin-top: 18px; width: 100%; padding: 14px; font-size: 16px; background: #3f8a2a; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .6; }
  .msg { margin-top: 14px; padding: 10px; border-radius: 6px; display: none; }
  .ok { background: #e4f5dc; color: #245c14; display: block; }
  .err { background: #f8dcdc; color: #7a1a1a; display: block; }
</style>
</head>
<body>
<main>
<h1>Choisir un nouveau mot de passe</h1>
<p>Le lien reçu par e-mail est valable une heure. Après validation, vous serez déconnecté de tous vos appareils et pourrez vous reconnecter dans l'application avec le nouveau mot de passe.</p>
<form id="f">
  <label for="p1">Nouveau mot de passe (8 caractères minimum)</label>
  <input id="p1" type="password" minlength="8" maxlength="100" autocomplete="new-password" required>
  <label for="p2">Confirmer</label>
  <input id="p2" type="password" minlength="8" maxlength="100" autocomplete="new-password" required>
  <button id="b" type="submit">Enregistrer</button>
  <div id="m" class="msg"></div>
</form>
<script>
  const token = new URLSearchParams(location.search).get('token') || '';
  const m = document.getElementById('m'), b = document.getElementById('b');
  const show = (text, ok) => { m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); };
  if (!token) show('Lien incomplet : ouvrez à nouveau le lien reçu par e-mail.', false);
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1 !== p2) return show('Les deux mots de passe ne correspondent pas.', false);
    b.disabled = true;
    try {
      const res = await fetch('/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, newPassword: p1 }) });
      const data = await res.json().catch(() => ({}));
      if (res.ok) { show('Mot de passe enregistré. Vous pouvez vous reconnecter dans l\'application.', true); document.getElementById('f').querySelectorAll('input').forEach(i => i.disabled = true); }
      else { show(data.error || 'Lien invalide ou expiré.', false); b.disabled = false; }
    } catch (err) { show('Connexion impossible, réessayez.', false); b.disabled = false; }
  });
</script>
</main>
</body>
</html>
